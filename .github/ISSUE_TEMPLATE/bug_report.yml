name: 回報問題
description: 在手機或電腦上試玩時遇到的問題
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 發生什麼事
      description: 你做了什麼、看到什麼、原本以為會怎樣
      placeholder: 例如：走到公園池塘旁邊，柴柴卡在石頭裡出不來
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: 截圖或錄影
      description: 直接把圖片拖進來或從相簿選
  - type: dropdown
    id: severity
    attributes:
      label: 嚴重程度
      options:
        - 不能玩（當掉、黑畫面、卡死）
        - 很影響（某個功能壞掉）
        - 小問題（看起來怪怪的）
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 裝置與遊戲狀態
      description: 從遊戲裡的「回報」按鈕開啟時會自動填好
      render: text
